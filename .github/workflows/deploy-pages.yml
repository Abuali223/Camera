name: GitHub Pages'ga deploy

# Har main push'da public/ papkasi gh-pages branchiga ko'chiriladi —
# GitHub Pages saytni o'sha branchdan servis qiladi.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: public/ ni gh-pages branchiga joylash
        run: |
          cd public
          touch .nojekyll
          # kesh-busting: har deploy'da fayllar yangi manzil oladi,
          # brauzer eski keshni ishlatmaydi
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" index.html
          echo "{\"build\":\"${BUILD}\"}" > version.json
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pages deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
