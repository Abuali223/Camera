name: GitHub Pages'ga deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Pages'ni sozlash
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sayt fayllarini yuklash (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
