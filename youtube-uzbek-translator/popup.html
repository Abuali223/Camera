<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: Roboto, Arial, sans-serif;
      font-size: 14px;
      background: #1c1c1e;
      color: #f2f2f2;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #ffd23f;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    label { flex: 1; }
    select, input[type="range"] {
      accent-color: #ffd23f;
    }
    select {
      background: #2c2c2e;
      color: #f2f2f2;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 6px;
    }
    .hint {
      font-size: 12px;
      color: #9a9a9a;
      line-height: 1.4;
      margin-top: 10px;
      border-top: 1px solid #333;
      padding-top: 10px;
    }
    #fontVal { min-width: 34px; text-align: right; color: #ffd23f; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #555; border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider { background: #ffd23f; }
    input:checked + .slider::before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h1>YouTube O'zbek Tarjimon</h1>

  <div class="row">
    <label for="enabled">Tarjima yoqilgan</label>
    <span class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </span>
  </div>

  <div class="row">
    <label for="mode">Rejim</label>
    <select id="mode">
      <option value="dual">Asl + O'zbekcha</option>
      <option value="replace">Faqat O'zbekcha</option>
    </select>
  </div>

  <div class="row">
    <label for="fontSize">Shrift</label>
    <input type="range" id="fontSize" min="14" max="36" step="1">
    <span id="fontVal">22</span>
  </div>

  <div class="hint">
    Ishlashi uchun videoda <b>CC (subtitr)</b> tugmasini yoqing.
    Subtitri yo'q videolarda "auto-generated" (avtomatik) subtitrni tanlang.
  </div>

  <script src="popup.js"></script>
</body>
</html>
